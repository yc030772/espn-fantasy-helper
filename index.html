<title>Fantasy BB 助手 · H2H Cat</title>
<style>

      --good:#3ddc97;--bad:#ff6b6b;--accent:#4c9aff;--warn:#ffb454;
      --PG:#4c9aff;--SG:#35c5f2;--SF:#3ddc97;--PF:#ffb454;--C:#ff7b72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang TC",Segoe UI,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(90deg,#17408b22,#c9082a22 55%,transparent);position:relative}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,#17408b,#c9082a)}
h1{font-size:16px;margin:0;font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 14px;cursor:pointer;border-radius:6px;font-size:13px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#06101f;font-weight:600}
main{padding:16px 18px;max-width:1400px}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.grow{flex:1;min-width:420px;overflow:hidden}
.side{width:330px;flex-shrink:0}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{background:#0c1014;border:1px solid var(--line);color:var(--fg);padding:6px 9px;border-radius:6px;font:inherit}
input[type=text]{width:170px}
label.chk{color:var(--dim);font-size:12px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
button.act{background:#212a34;border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--dim);font-weight:500;font-size:11px;padding:5px 6px;position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
th:first-child,th.l,td.l{text-align:left}

img.logo{width:18px;height:18px;object-fit:contain;flex-shrink:0;

tbody tr{border-left:3px solid transparent}
.abbr{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:3px;color:#fff;
  border:1px solid rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.posb{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#1e2630}
tbody tr:hover{background:#1d242c}
tbody tr.rec{background:#14304f}
tbody tr.rec:hover{background:#1a3c63}
tbody tr.rec td{border-top-color:#25507f}
.rechip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--accent);color:#06101f;margin-left:6px;flex-shrink:0}
.scroll{max-height:66vh;overflow:auto}
.pos{color:var(--dim);font-size:11px}
.pill{font-size:10px;padding:1px 5px;border-radius:4px;background:#2a2016;color:var(--warn);
  margin-left:4px;flex-shrink:0}
.pill.nodata{background:#1b2430;color:#8fb6e8}
.edge-p{color:var(--good)}.edge-n{color:var(--dim)}
.edge-w{color:var(--warn);font-weight:600}
.bar{height:7px;border-radius:4px;background:#222a33;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--good)}
.bar i.neg{background:var(--bad)}
.catrow{display:grid;grid-template-columns:38px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.catrow b{font-weight:500;color:var(--dim)}
.num{text-align:right;color:var(--dim)}
.mine{color:var(--good)}
.gone{opacity:.32}
.hint{color:var(--dim);font-size:12px;margin:8px 0 0}
.tag{display:inline-flex;align-items:center;gap:5px;background:#212a34;border:1px solid var(--line);
  border-left-width:3px;border-radius:5px;padding:2px 7px;margin:2px;font-size:12px;cursor:pointer}
.tag img{width:17px;height:17px;object-fit:contain;background:#e9edf2;border-radius:50%;padding:1.5px}
.tag.sel{background:var(--accent);color:#06101f;border-color:var(--accent)}
.big{font-size:22px;font-weight:600}
.err{color:var(--bad);font-size:12px}
.draftbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.clock{padding:4px 12px;border-radius:6px;background:#1e2630;border:1px solid var(--line);font-size:13px}
.clock.me{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
button.act.pick{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:700}
.strow{display:grid;grid-template-columns:38px 1fr 34px 44px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.strow b{font-weight:500;color:var(--dim)}
.strow .rk{text-align:right;font-weight:700}
.strow .gap{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.strow .bar i{left:0}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#7d8794;opacity:.85}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcol{background:#12171d;border:1px solid var(--line);border-radius:8px;padding:7px}
.bcol.bme{border-color:var(--accent);background:#131f2e}
.bhead{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--fg)}
.bp{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 4px;margin:2px 0;
  border-left:3px solid var(--line);background:#1a212a;border-radius:3px}
.bp img{width:14px;height:14px;object-fit:contain;background:#e9edf2;border-radius:50%;padding:1px}
.bp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.matrix td{border-top:1px solid #1d232b}
.rksup{font-size:9px;color:var(--dim);margin-left:2px}
.sarr{color:var(--accent);margin-left:3px;font-size:9px}
.rstrip{display:flex;gap:6px;flex-wrap:wrap}
.rcell{flex:1;min-width:64px;background:#12171d;border:1px solid var(--line);border-radius:6px;
  padding:5px 7px;display:flex;flex-direction:column;gap:1px;font-size:12px}
.rcell b{font-weight:500;color:var(--dim);font-size:10px}
.rcell span:nth-child(2){font-weight:700}
.rcell .pos{font-size:10px}
.rcell.rsum{border-color:var(--accent)}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--fg)}
</style>

<header>
  <h1>🏀 Fantasy 助手 <span style="color:var(--dim);font-weight:400">H2H 9-Cat</span></h1>
  <span class="hint" id="src"></span>
  <div class="tabs">
    <button data-t="draft" class="on">選秀</button>
    <button data-t="all">總分表</button>
    <button data-t="trade">交易</button>
    <button data-t="fa">FA</button>
    <button data-t="league">連結聯盟</button>
  </div>
</header>
<main id="app"></main>

<script>
const CATS=['PTS','REB','AST','STL','BLK','3PM','TO','FG_imp','FT_imp'];
// 建議權重 = 1/σ(隊伍該類別總分),TO 因與 PTS/AST 相關 -0.85 額外壓低
const PRESETS={
  '均衡(建議)':{PTS:1.25,REB:1.10,AST:1.00,STL:1.20,BLK:0.90,'3PM':0.95,TO:0.60,FG_imp:0.90,FT_imp:0.75},
  '全部 1.0(純 z)':{PTS:1,REB:1,AST:1,STL:1,BLK:1,'3PM':1,TO:1,FG_imp:1,FT_imp:1},
  '棄 TO + FT%':{PTS:1.35,REB:1.15,AST:1.20,STL:1.25,BLK:0.95,'3PM':1.00,TO:0,FG_imp:0.95,FT_imp:0},
  '棄 FG% + BLK':{PTS:1.30,REB:1.05,AST:1.15,STL:1.25,BLK:0,'3PM':1.20,TO:0.60,FG_imp:0,FT_imp:0.95},
  '棄 AST + 3PM(大隻佬)':{PTS:1.25,REB:1.30,AST:0,STL:1.15,BLK:1.30,'3PM':0,TO:0.70,FG_imp:1.15,FT_imp:0.60},
};
const LBL={PTS:'PTS',REB:'REB',AST:'AST',STL:'STL',BLK:'BLK','3PM':'3PM',TO:'TO',FG_imp:'FG%',FT_imp:'FT%'};
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S=JSON.parse(localStorage.getItem('fbb')||'{}');
const save=()=>localStorage.setItem('fbb',JSON.stringify(S));
S.picks=S.picks||[]; S.nTeams=S.nTeams||12; S.slot=S.slot||1;
// 拍賣模式:owner[i]/price[i] 與 picks[i] 平行,第 i 個成交的人歸誰、花多少
S.owner=S.owner||[]; S.price=S.price||[];
// 舊版蛇型選秀存的 picks 沒有得標隊伍/價格,對不上就清掉
if(S.owner.length!==S.picks.length||S.price.length!==S.picks.length){S.picks=[];S.owner=[];S.price=[]}
delete S.auction;
S.budget=S.budget||200; S.reserve=S.reserve||2; S.reserveLast=S.reserveLast||3; S.rsize=S.rsize||13; S.bidder=S.bidder||0;
S.dsort=S.dsort||{k:'total',dir:-1};  // 選秀頁排序:預設總分降冪
S.fsort=S.fsort||{k:'total',dir:-1};  // FA 頁
S.asort=S.asort||{k:'total',dir:-1};  // 總分表
if(S.gp===undefined)S.gp=false;   // 出賽數折算預設關,見 durability()
S.mine=[]; S.gone=[];   // 由 picks 推導,見 syncDraft()
S.w=S.w||{...PRESETS['均衡(建議)']}; S.preset=S.preset||'均衡(建議)';
let P=[], byId={}, T={}, tab='draft';
const teamOf=i=>S.owner[i];
const rosterOf=t=>S.picks.filter((_,i)=>teamOf(i)===t);
const realName=t=>S.teams&&S.teams[t]?S.teams[t].name:`Team ${t+1}`;
// 我方顯示「me (真實隊名)」:打 me 或打自己隊名都找得到,也看得出 me 對到哪一隊
const teamName=t=>t===S.slot-1?`me (${realName(t)})`:realName(t);
/* --- 拍賣 --- */
const spent=t=>S.price.reduce((s,x,i)=>s+(S.owner[i]===t?x:0),0);
const moneyLeft=t=>S.budget-spent(t);
// 還能出的最高價 = 剩餘預算 − 其他空位的保留金。別隊照 ESPN 規則每格 $1;
// 我自己每格保留 S.reserve(預設 $2),最後 3 格各保留 S.reserveLast(預設 $3),
// 尾盤才能用 $2~3 搶下別人只出得起 $1 的人
const reserveFor=(t,n)=>t===S.slot-1?Math.min(n,3)*S.reserveLast+Math.max(0,n-3)*S.reserve:n;
const maxBid=t=>{const open=S.rsize-rosterOf(t).length;
  return open>0?Math.max(0,moneyLeft(t)-reserveFor(t,open-1)):0};
/* 建議出價:
   1. 我方價值 = 每人 $1 底價 + 依「總分超出替補水準」分配剩下的錢。
      替補水準 = 第 隊數×人數 名的總分(這之後的人會是 $1 或沒人要)。
   2. 有 ESPN 拍賣價就跟我方價值平均(回測 ESPN 排名比我們準)。新秀只有 ESPN 價。
   3. 通膨:場上剩下的錢 ÷ 剩下該被買走的價值。前面有人買貴,後面就變便宜,反之亦然。 */
function auctionValues(){
  const N=S.nTeams*S.rsize, pot=S.nTeams*S.budget-N;
  const ranked=P.filter(p=>total(p)!==null).sort((a,b)=>total(b)-total(a));
  const top=ranked.slice(0,N), repl=total(top[top.length-1]);
  const sum=top.reduce((s,p)=>s+total(p)-repl,0)||1;
  const v={};
  top.forEach(p=>v[p.id]=1+(total(p)-repl)/sum*pot);
  P.forEach(p=>{if(p.auction)v[p.id]=v[p.id]?(v[p.id]+p.auction)/2:p.auction});
  const open=N-S.picks.length;
  const money=[...Array(S.nTeams).keys()].reduce((s,t)=>s+moneyLeft(t),0)-open;
  const rest=P.filter(p=>v[p.id]&&!S.picks.includes(p.id)).map(p=>v[p.id]-1)
    .sort((a,b)=>b-a).slice(0,open).reduce((s,x)=>s+x,0);
  return {v,infl:rest>0?Math.max(0,money)/rest:1};
}
let AV={v:{},infl:1};
const bid=p=>{const x=AV.v[p.id];return x?Math.max(1,Math.round(1+(x-1)*AV.infl)):null};
function syncDraft(){
  S.mine=rosterOf(S.slot-1);
  S.gone=S.picks.filter(id=>!S.mine.includes(id));
}
const tm=p=>T[p.team]||{abbr:'FA',color:'#39424e',logo:''};
const logo=p=>tm(p).logo?`<img class="logo" src="${tm(p).logo}" alt="" loading="lazy">`:'';
const posBadge=p=>`<span class="posb" style="color:var(--${p.pos})">${p.pos}</span>`;
const abbrChip=p=>`<span class="abbr" style="background:${tm(p).color}">${tm(p).abbr}</span>`;

const noData=p=>p.sample==='none';     // 新秀等,去年沒有 NBA 數據
const thin=p=>p.sample==='thin';       // 有數據但場次太少
/* 兩件不同的事,分開處理:
   1. 可靠度 — 只打 5 場的場均數字不可信,往中間收縮。永遠開著。
      滿季 = 1;19 場 ≈ .75;1 場 ≈ .19。
      注意這救不回受傷的球星:他們的「場均」本身就是帶傷打出來的(Sabonis
      去年 19 場只有 15.8 分 / 29.7 分鐘),不做收縮也一樣低。要看出這種
      情況,靠下面的「落差」欄位跟 ESPN 排名對照。
   2. 出賽數折算 — 假設「去年缺賽的人今年還會缺」。預設關閉,因為
      受傷整季、今年健康歸隊的球員會被嚴重低估。要模擬 H2H 的出場風險再打開。 */
const reliab=p=>(p.GP/(p.GP+10))/(70/80);
const durability=p=>S.gp?Math.min(1,(p.GP+8)/70):1;
// 無數據的人給 0(未知),不是負分 —— 沒資料不等於很爛
const catZ=(p,c)=>noData(p)?0:p['z'+c]*Math.min(1,reliab(p))*durability(p);
const total=p=>noData(p)?null:CATS.reduce((s,c)=>s+S.w[c]*catZ(p,c),0);   // 加權總分
const totalOr=(p,d=-99)=>{const v=total(p);return v===null?d:v};
const hasAdp=p=>p.adp&&p.adp<140;   // 140 = ESPN 未排名的預設值
/* 排序依據。回測 312 人:ESPN 排名對「下一季實際 9-cat 表現」的 Spearman
   ρ=.906,去年實際數據只有 .769,混合反而更差 -> 預設用 ESPN 排名。
   但去年數據仍然不可少:類別強弱、建議、交易分析全部靠它。 */
/* 我方名次:對全部球員算一次,不隨已選走的人變動,才能跟 ESPN 排名直接相減。
   ESPN 那邊直接用它自己的排名數字 —— 不要跟 ADP 混,兩者尺度不同:
   ADP 有 140 的天花板,251 名只有 ADP 的球員全擠在 140 以內,
   一混就會把 ESPN 真實排名 >100 的人整批往後推(Knueppel #147 被擠到 #403)。 */
function computeRanks(){
  P.filter(p=>total(p)!==null).sort((a,b)=>total(b)-total(a))
   .forEach((p,i)=>p.mrank=i+1);
  P.filter(p=>total(p)===null).forEach(p=>p.mrank=null);
}
const gap=p=>(p.espn_rank&&p.mrank)?p.espn_rank-p.mrank:null;

// 分數熱度:綠(強)→ 灰(中)→ 紅(弱)
const heat=v=>{const t=Math.max(-1,Math.min(1,v/8));
  return t>0?`hsl(${152-t*8} 65% ${52+t*14}%)`:`hsl(${6} ${45+(-t)*30}% ${58+t*10}%)`};
const hot=(v,d=1)=>v===null?'<span class="pos">–</span>':`<b style="color:${heat(v)}">${v.toFixed(d)}</b>`;

fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  P=d.players||d; T=d.teams||{};                       // 舊格式(純陣列)也還能開
  P.forEach(p=>byId[p.id]=p);
  $('#src').innerHTML=`${P.length} 名球員 · 數據 ${P[0]?.source||'2025-26 實際'} · 排名/ADP 2026-27`;
  render();
  fetchLeague(S.leagueId||'829293495',S.year||'2027').then(render).catch(()=>{});   // 開頁一定重抓:隊名與名單會因交易改變,不能用舊快取
});

/* ---------- ESPN 選秀室同步(espn-draft-sync.user.js 送來的 Picks 清單) ----------
   只新增/更新,不刪除:ESPN 清單沒捲到的舊成交不會被誤刪。 */
const normName=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[.'’]/g,'').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/\s+/g,' ').trim();
let SYNC={n:0,at:null,miss:[]};
function applyEspnPicks(list){
  if(!P.length)return;
  const byName={}; P.forEach(p=>byName[normName(p.name)]=p);
  const teamIdx=t=>{t=t.replace(/(\.\.\.|…)$/,'').trim().toLowerCase();   // 太長的隊名 ESPN 會截斷
    const i=[...Array(S.nTeams).keys()].find(i=>realName(i).toLowerCase()===t);
    return i!==undefined?i:[...Array(S.nTeams).keys()].find(i=>realName(i).toLowerCase().startsWith(t))??-1};
  let changed=false; const miss=[];
  list.forEach(x=>{
    const p=(x.id&&byId[x.id])||byName[normName(x.name)], t=teamIdx(x.team);   // 有 ESPN id 先用 id
    if(!p||t<0){miss.push(`${x.name} (${x.team})`);return}
    const i=S.picks.indexOf(p.id);
    if(i<0){S.picks.push(p.id);S.owner.push(t);S.price.push(x.price);changed=true}
    else if(S.owner[i]!==t||S.price[i]!==x.price){S.owner[i]=t;S.price[i]=x.price;changed=true}
  });
  SYNC={n:list.length,at:new Date(),miss};
  if(changed){save();render()}else{const e=$('#sync');if(e)e.innerHTML=syncText()}
}
const syncText=()=>SYNC.at?`ESPN 同步 ${SYNC.n} 筆 · ${SYNC.at.toLocaleTimeString()}`
  +(SYNC.miss.length?` · <span style="color:var(--bad)" title="${SYNC.miss.join('\n')}">對不到 ${SYNC.miss.length} 筆</span>`:''):'ESPN 未同步';
// ESPN 換人競標 -> 出價面板自動切到那個人
function applyEspnNom(name){
  const p=name&&P.find(q=>normName(q.name)===normName(name));
  if(!p||S.picks.includes(p.id)||S.nom===p.id)return;
  S.nom=p.id;S.cur=0;save();drawNom();redrawDraft();
}
window.addEventListener('message',e=>{if(!e.data)return;
  if(e.data.type==='espn-picks')applyEspnPicks(e.data.picks);
  if(e.data.type==='espn-nom')applyEspnNom(e.data.name)});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

/* ---------- 陣容 / 分類強弱 ---------- */
const teamCats=ids=>{const t={};CATS.forEach(c=>t[c]=ids.reduce((s,i)=>s+(byId[i]?catZ(byId[i],c):0),0));return t};
/* 預估最終陣容 = 已選 + 空位用「池子平均」補滿,這樣人數不同的隊伍才能公平比類別名次。
   池子 = 還沒被買走、有數據的人依總分取前 N 名,N = 全聯盟剩下的空位數(這些人最後會被選走)。
   每隊空位都用同一個平均補,差別只來自已經選到的人。 */
function poolAvg(){
  const n=Math.max(0,S.nTeams*S.rsize-S.picks.length);
  const top=P.filter(p=>!S.picks.includes(p.id)&&!noData(p)).sort((a,b)=>total(b)-total(a)).slice(0,n);
  const a={}; CATS.forEach(c=>a[c]=top.length?top.reduce((s,p)=>s+catZ(p,c),0)/top.length:0);
  return a;
}
function projCats(t,avg=poolAvg()){
  const r=rosterOf(t), c=teamCats(r), open=Math.max(0,S.rsize-r.length);
  CATS.forEach(k=>c[k]+=open*avg[k]);
  return c;
}
const teamW=ids=>{const t=teamCats(ids);CATS.forEach(c=>t[c]*=S.w[c]);return t};
// 弱項加權:我缺的類別,該類別的球員對我更值錢
function weights(ids){
  const t=teamCats(ids), n=Math.max(ids.length,1), w={};
  const avg=CATS.map(c=>t[c]/n), m=Math.max(...avg.map(Math.abs),.5);
  CATS.forEach((c,i)=>w[c]=Math.min(1.6,Math.max(.5,1-avg[i]/m)));
  return w;
}
// 補洞分:完全以「我缺什麼」加權。只用來挑出建議人選,不參與排序。
const fit=(p,w)=>CATS.reduce((s,c)=>s+w[c]*S.w[c]*catZ(p,c),0);
// 建議名單 = 補洞分最高的前 n 名(隊上還沒人時沒有弱項訊號,不標)
function recSet(pool,ids,n=8){
  if(!ids.length)return new Set();
  const w=weights(ids);
  return new Set([...pool].filter(p=>!noData(p))     // 無數據的人無從判斷補不補洞
    .sort((a,b)=>fit(b,w)-fit(a,w)).slice(0,n).map(p=>p.id));
}

function catBars(t,scale){
  const box=el('div');
  CATS.forEach(c=>{
    const v=t[c], pct=Math.min(50,Math.abs(v)/scale*50);
    const r=el('div','catrow');
    r.append(el('b',null,LBL[c]));
    const bar=el('div','bar'), i=el('i',v<0?'neg':'');
    i.style.width=pct+'%'; i.style.left=v<0?(50-pct)+'%':'50%';
    bar.append(i); r.append(bar);
    r.append(el('span','num '+(v>0?'mine':''),v.toFixed(1)));
    box.append(r);
  });
  return box;
}

/* 固定欄位也納入排序,跟資料欄位用同一套機制 */
function fixedCols(rec){return [
  {h:'球員',k:'name',l:1,v:p=>p.name,
   f:p=>`${logo(p)}<span>${p.name}</span>`
     +`${rec&&rec.has(p.id)?'<span class="rechip">建議</span>':''}`
     +`${noData(p)?'<span class="pill nodata">新秀/無數據</span>'
        :thin(p)?`<span class="pill">去年僅 ${p.GP} 場</span>`:''}`
     +`${p.injury&&p.injury!=='ACTIVE'?`<span class="pill">${p.injury}</span>`:''}`},
  {h:'隊',k:'team',l:1,v:p=>tm(p).abbr,f:p=>abbrChip(p)},
  {h:'POS',k:'pos',l:1,v:p=>p.pos,f:p=>posBadge(p)},
  {h:'GP',k:'GP',desc:1,v:p=>p.GP,f:p=>p.GP},
  {h:'MIN',k:'MIN',desc:1,v:p=>p.MIN,f:p=>p.MIN},
]}

/* 依 sort={k,dir} 排序。沒有值的球員(新秀)永遠排最後,不論升降冪。 */
function sortList(list,cols,sort){
  let c=[...fixedCols(),...cols].find(x=>x.k===sort.k);
  if(!c||!c.v){                       // 欄位已移除或舊設定失效 -> 退回總分降冪
    sort.k='total'; sort.dir=-1;
    c=cols.find(x=>x.k==='total');
    if(!c)return list;
  }
  const big=Number.MAX_SAFE_INTEGER;
  return [...list].sort((a,b)=>{
    let av=c.v(a),bv=c.v(b);
    if(typeof av==='string')return av.localeCompare(bv)*sort.dir;
    const an=av==null||Number.isNaN(av), bn=bv==null||Number.isNaN(bv);
    if(an||bn)return an&&bn?0:(an?1:-1);          // 無值一律墊底
    return (av-bv)*sort.dir;
  });
}
/* 點欄位標題:同一欄再點一次換方向,換欄位則用該欄的預設方向 */
function toggleSort(sort,c){
  if(sort.k===c.k)sort.dir=-sort.dir;
  else{sort.k=c.k;sort.dir=c.desc?-1:1;}
  return sort;
}

function playerTable(list,cols,rowAct,onSort,rec,sort){
  const all=fixedCols(rec).concat(cols);
  const wrap=el('div','scroll'), tb=el('table');
  const arrow=c=>sort&&sort.k===c.k?`<span class="sarr">${sort.dir<0?'▼':'▲'}</span>`:'';
  tb.innerHTML='<thead><tr><th class="l">#</th>'
    +all.map(c=>`<th class="${c.l?'l ':''}${c.k&&onSort?'sortable':''}">${c.h}${arrow(c)}</th>`).join('')
    +'<th></th></tr></thead>';
  if(onSort)tb.querySelectorAll('th').forEach((th,i)=>{
    const c=all[i-1];
    if(i>=1&&c&&c.k)th.onclick=()=>onSort(c);
  });
  const body=el('tbody');
  list.forEach((p,i)=>{
    const tr=el('tr');
    if(rec&&rec.has(p.id))tr.classList.add('rec');
    if(S.mine.includes(p.id))tr.classList.add('mine');
    tr.style.borderLeftColor=tm(p).color;
    tr.innerHTML=`<td class="l">${i+1}</td>`
      +all.map(c=>`<td class="${c.l?'l ':''}${c.k==='name'?'name':''}">${c.f(p)}</td>`).join('');
    const td=el('td'); if(rowAct)rowAct(p,td); tr.append(td); body.append(tr);
  });
  tb.append(body); wrap.append(tb); return wrap;
}

function draftView(app){
  /* --- 最上面:聯盟設定與現在輪到誰 --- */
  const setup=el('div','card'); setup.style.marginBottom='12px';
  setup.append(el('h2',null,'拍賣選秀設定'));
  const line=el('div','draftbar');
  const mk=(label,val,min,max,on)=>{
    const g=el('span'); g.append(el('span','pos',label+' '));
    const i=Object.assign(document.createElement('input'),{type:'number',min,max,value:val});
    i.style.width='58px'; i.onchange=()=>on(Math.max(min,Math.min(max,+i.value||min)));
    g.append(i); return g;
  };
  line.append(mk('隊伍數',S.nTeams,2,20,v=>{S.nTeams=v;S.slot=Math.min(S.slot,v);save();render()}));
  // 我是哪一隊:直接選隊名(沒抓到聯盟時顯示 Team N)
  const me=el('span'); me.append(el('span','pos','我是 '));
  const ms=el('select');
  for(let t=0;t<S.nTeams;t++)ms.append(new Option(realName(t),t+1));
  ms.value=S.slot; ms.onchange=()=>{S.slot=+ms.value;if(S.teams)S.myTeam=S.teams[S.slot-1].id;save();render()};
  me.append(ms); line.append(me);
  draftAuctionBar(line,mk);

  const un=el('button','act','復原上一手'); un.onclick=()=>{S.picks.pop();S.owner.pop();S.price.pop();save();render()};
  const rs=el('button','act','重置選秀'); rs.onclick=()=>{if(confirm('清空整個選秀板?')){S.picks=[];S.owner=[];S.price=[];save();render()}};
  line.append(un,rs);
  const gp=el('label','chk'); gp.innerHTML='<input type="checkbox"'+(S.gp!==false?' checked':'')+'> 考慮出賽數';
  gp.querySelector('input').onchange=e=>{S.gp=e.target.checked;save();render()};
  line.append(gp);
  setup.append(line);
  app.append(setup);
  draftRest(app);
}

/* --- 拍賣成交紀錄:誰被哪隊用多少買走,可直接改隊伍/價格或刪除 --- */
function saleLog(){
  const box=el('div','card'); box.style.marginTop='12px';
  box.append(el('h2',null,`成交紀錄 (${S.picks.length} 筆 · 共 $${S.price.reduce((a,b)=>a+b,0)})`));
  if(!S.picks.length){box.append(el('p','hint','上方選「得標」隊伍、填價格,在球員列按「成交」就會記在這裡。'));return box}
  const wrap=el('div','scroll'), tb=el('table');
  tb.innerHTML='<thead><tr><th class="l">#</th><th class="l">球員</th><th class="l">得標隊伍</th><th>價格</th><th>建議</th><th></th></tr></thead>';
  const body=el('tbody');
  S.picks.map((id,i)=>i).reverse().forEach(i=>{   // 最新的在最上面
    const p=byId[S.picks[i]], tr=el('tr'); if(!p)return;
    if(S.owner[i]===S.slot-1)tr.classList.add('mine');
    tr.innerHTML=`<td class="l">${i+1}</td><td class="l name">${logo(p)}<span>${p.name}</span></td>`;
    const ts=el('td','l'), sel=el('select');
    for(let t=0;t<S.nTeams;t++)sel.append(new Option(teamName(t),t));
    sel.value=S.owner[i]; sel.onchange=()=>{S.owner[i]=+sel.value;save();render()};
    ts.append(sel);
    const ps=el('td'), pi=Object.assign(document.createElement('input'),{type:'number',min:1,value:S.price[i]});
    pi.style.width='64px'; pi.onchange=()=>{S.price[i]=Math.max(1,+pi.value||1);save();render()};
    ps.append(pi);
    const b=AV.v[p.id]?Math.round(AV.v[p.id]):null;
    const bt=el('td',null,b?`<span style="color:${S.price[i]>b?'var(--bad)':'var(--good)'}">$${b}</span>`:'-');
    const dt=el('td'), del=el('button','act','刪除');
    del.onclick=()=>{if(confirm(`刪除 ${p.name} 這筆成交?`)){[S.picks,S.owner,S.price].forEach(a=>a.splice(i,1));save();render()}};
    dt.append(del);
    tr.append(ts,ps,bt,dt); body.append(tr);
  });
  tb.append(body); wrap.append(tb); box.append(wrap);
  box.append(el('p','hint','「建議」= 未計通膨的公平價;紅色 = 買貴了。'));
  return box;
}

/* --- 9 類別相對排名:我 vs 其他 11 隊 --- */
function drawStandings(){
  const box=$('#stand'); if(!box)return; box.innerHTML='';
  if(!S.picks.length){
    box.append(el('p','hint','開始選人之後,這裡會顯示你在每個類別排第幾(共 '+S.nTeams+' 隊),以及最弱的三項。'));
    return;
  }
  const avg=poolAvg(), all=[...Array(S.nTeams).keys()].map(t=>({t,cat:projCats(t,avg)}));
  const me=all[S.slot-1], half=Math.ceil(S.nTeams/2);
  const strip=el('div','rstrip');
  let wins=0; const ranked=[];
  CATS.forEach(c=>{
    const sorted=[...all].sort((a,b)=>b.cat[c]-a.cat[c]);
    const r=sorted.findIndex(x=>x.t===me.t)+1;
    ranked.push([c,r]);
    if(r<=half)wins++;
    const col=r<=3?'var(--good)':r<=half?'var(--warn)':'var(--bad)';
    const cell=el('div','rcell');
    cell.innerHTML=`<b>${LBL[c]}</b><span style="color:${col}">#${r}</span>`
      +`<span class="pos">${me.cat[c].toFixed(1)}</span>`;
    cell.title=`第一名 ${sorted[0].cat[c].toFixed(1)} · 我 ${me.cat[c].toFixed(1)}`;
    strip.append(cell);
  });
  const sum=el('div','rcell rsum');
  sum.innerHTML=`<b>前段</b><span style="color:${wins>=5?'var(--good)':'var(--bad)'}">${wins}/9</span>`
    +`<span class="pos">要 5</span>`;
  strip.append(sum);
  box.append(strip);
  const weak=ranked.sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>LBL[x[0]]);
  box.append(el('p','hint','最弱三項:<b style="color:var(--bad)">'+weak.join(' · ')
    +'</b> —— 能補這幾項的人會<b style="color:var(--accent)">反白標「建議」</b>,但排序照你點的欄位。'));
}

/* --- 各隊 × 各類別 對照表 --- */
function standingsTable(rosters){
  const box=el('div','card'); box.style.marginTop='12px';
  box.append(el('h2',null,rosters?'ESPN 實際名單 · 各隊 × 各類別':'各隊 × 各類別 對照表'));
  if(!rosters&&!S.picks.length){
    box.append(el('p','hint','開始選人之後,這裡會列出全部 '+S.nTeams+' 隊在 9 個類別的數字與名次。'));
    return box;
  }
  const avg=rosters?null:poolAvg();
  const all=[...Array(S.nTeams).keys()].map(t=>{const ids=rosters?rosters[t]:rosterOf(t);
    return {t,cat:rosters?teamCats(ids):projCats(t,avg),n:ids.length,unk:ids.filter(i=>byId[i]&&noData(byId[i])).length}});
  // 每個類別的名次
  const rk={};
  CATS.forEach(c=>{
    const sorted=[...all].sort((a,b)=>b.cat[c]-a.cat[c]);
    rk[c]={}; sorted.forEach((x,i)=>rk[c][x.t]=i+1);
  });
  const half=Math.ceil(S.nTeams/2);
  const wrap=el('div','scroll'), tb=el('table','matrix');
  tb.innerHTML='<thead><tr><th class="l">隊伍</th><th>人數</th>'
    +CATS.map(c=>`<th>${LBL[c]}</th>`).join('')+'<th>前段</th></tr></thead>';
  const body=el('tbody');
  // 依「站上前段的類別數」排,強隊在上
  const score=x=>CATS.filter(c=>rk[c][x.t]<=half).length;
  [...all].sort((a,b)=>score(b)-score(a)).forEach(x=>{
    const tr=el('tr'); if(x.t===S.slot-1)tr.classList.add('rec');
    let html=`<td class="l"><b>${teamName(x.t)}</b></td>`
      +`<td>${x.n}${x.unk?`<sup class="rksup" title="其中 ${x.unk} 人無數據,未計入">+${x.unk}?</sup>`:''}</td>`;
    CATS.forEach(c=>{
      const r=rk[c][x.t];
      const col=r<=3?'var(--good)':r<=half?'var(--warn)':'var(--bad)';
      html+=`<td><span style="color:${col}">${x.cat[c].toFixed(1)}</span>`
           +`<sup class="rksup">${r}</sup></td>`;
    });
    const w=score(x);
    html+=`<td><b style="color:${w>=5?'var(--good)':'var(--bad)'}">${w}/9</b></td>`;
    tr.innerHTML=html; body.append(tr);
  });
  tb.append(body); wrap.append(tb); box.append(wrap);
  const totUnk=all.reduce((s,x)=>s+x.unk,0);
  if(totUnk)box.append(el('p','hint',
    `⚠ 已選走的人裡有 <b>${totUnk}</b> 位沒有去年數據(新秀等),類別統計未計入 —— 人數欄的 <code>+N?</code> 就是。`));
  box.append(el('p','hint','數字 = 預估最終陣容(已選 + 空位用剩下好球員的平均補滿)該類別的 z 總和,右上小字 = 名次。'
    +`綠 = 前 3、黃 = 前段、紅 = 後段。「前段」= 排在前 ${half} 名的類別數,H2H 需要 5 類。`));
  return box;
}

  box.append(el('h2',null,`選秀板 (已選 ${S.picks.length} 人)`));
  const grid=el('div','board');

function redrawDraft(){
  const q=($('#q')?.value||'').toLowerCase(), pf=$('#pf')?.value||'全部';
  const w=weights(S.mine);
  let pool=P.filter(p=>!S.picks.includes(p.id))
    .filter(p=>p.name.toLowerCase().includes(q)&&(pf==='全部'||p.pos===pf));
  const rec=recSet([...pool].filter(p=>p.mrank).sort((a,b)=>a.mrank-b.mrank).slice(0,120),S.mine);
  const cz=(p,c)=>noData(p)?null:S.w[c]*catZ(p,c);
  const cols=[
    // 欄位 1、2:兩套排序
    {h:'ESPN 排序',k:'espn',v:p=>p.espn_rank||null,
     f:p=>p.espn_rank?`<b>${p.espn_rank}</b>`
       :`<span class="pos" title="ESPN 尚未給排名(多為新秀),這裡只有 ADP ${hasAdp(p)?Math.round(p.adp):'也沒有'}">–</span>`},
    {h:'總分',k:'total',desc:1,v:p=>total(p),f:p=>hot(total(p))},
    {h:'補洞',k:'fit',desc:1,v:p=>S.mine.length&&!noData(p)?fit(p,w):null,
     f:p=>S.mine.length&&!noData(p)?fit(p,w).toFixed(1):'-'},
  ].concat(CATS.map(c=>({h:LBL[c],k:c,desc:1,v:p=>cz(p,c),
     f:p=>{const v=cz(p,c);return v===null?'<span class="pos">–</span>'
       :`<span style="color:${heat(v*2.2)}">${v.toFixed(1)}</span>`}})))
   .concat([
    {h:'$',k:'auction',desc:1,v:p=>p.auction||null,
     f:p=>p.auction?`<span style="color:var(--warn)">$${p.auction}</span>`:'-'},
  ]);
  {
    const my=maxBid(S.slot-1);
    cols.unshift({h:'建議 $',k:'bid',desc:1,v:p=>bid(p),f:p=>{const b=bid(p);
      return b===null?'-':`<b style="color:${b>my?'var(--bad)':'var(--good)'}" title="${b>my?'超過你最高可出的 $'+my:''}">$${b}</b>`}});
    // ESPN 今年實際拍賣的平均成交價 = 市場行情。比建議價高很多 = 大家愛喊;低很多 = 可能撿便宜
    cols.splice(1,0,{h:'成交均價',k:'avg_paid',desc:1,v:p=>p.avg_paid||null,f:p=>{const a=p.avg_paid,b=bid(p);
      return a?`<span style="color:${b&&a>b+5?'var(--bad)':b&&a<b-5?'var(--good)':'inherit'}">$${Math.round(a)}</span>`:'-'}});
  }
  pool=sortList(pool,cols,S.dsort);
  const shown=pool.slice(0,250);
  const tbl=playerTable(shown,cols,null,c=>{toggleSort(S.dsort,c);save();redrawDraft()},rec,S.dsort);
  // 點人名 -> 上方出價面板
  tbl.querySelectorAll('tbody tr').forEach((tr,i)=>{
    const td=tr.querySelector('td.name'); td.style.cursor='pointer'; td.title='點我登記出價';
    if(shown[i].id===S.nom)tr.style.outline='2px solid var(--accent)';
    td.onclick=()=>{if(getSelection().toString())return;   // 正在選取文字(要複製人名)就不開面板
      S.nom=shown[i].id;S.cur=0;save();drawNom();redrawDraft()};
  });
  const cn=[...fixedCols(),...cols].find(c=>c.k===S.dsort.k);
  $('#dlh').innerHTML=`球員排名(依${cn?cn.h:'?'} ${S.dsort.dir<0?'降冪':'升冪'})`;
  const dt=$('#dlt'); dt.innerHTML=''; dt.append(tbl);
}

/* 送給 ESPN 選秀室的儀表板(espn-draft-sync.user.js 轉送並畫在 Picks 上方):
   當前球員的價位 + 我在 9 類別的名次 */
function postDash(p,left,open,bp,my){
  const half=Math.ceil(S.nTeams/2);
  let cats=null;
  if(rosterOf(S.slot-1).length){
    const avg=poolAvg(), all=[...Array(S.nTeams).keys()].map(t=>projCats(t,avg));
    cats=CATS.map(c=>({c:LBL[c],r:1+all.filter(x=>x[c]>all[S.slot-1][c]).length}));
  }
  // 還沒被買走的人:補洞前五(依我缺的類別加權,要先有隊員)、總分前五
  const pool=P.filter(q=>!S.picks.includes(q.id)&&total(q)!==null), w=weights(S.mine);
  const top=(f)=>[...pool].sort((a,b)=>f(b)-f(a)).slice(0,5).map(q=>({n:q.name,v:+f(q).toFixed(1),b:bid(q)}));
  const fitTop=S.mine.length?top(q=>fit(q,w)):null, totTop=top(total);
  window.postMessage({type:'espn-dash',d:{fitTop,totTop,name:p?p.name:null,left,open,bid:bp,
    avg:p&&p.avg_paid?Math.round(p.avg_paid):null,espn:p?p.auction||null:null,my,cats,half,n:S.nTeams}},'*');
}
/* datalist 依打的字重排:整個名字字首符合 > 某個字的字首符合(例如姓) > 其他。
   瀏覽器照 option 的順序顯示,所以直接搬動 option。 */
function rankList(dl,v){
  v=v.trim().toLowerCase(); if(!v)return;
  const score=o=>{const n=o.value.toLowerCase();
    return n.startsWith(v)?0:n.split(/[\s(]+/).some(w=>w.startsWith(v))?1:2};
  [...dl.options].map((o,i)=>[score(o),i,o]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).forEach(x=>dl.append(x[2]));
}
/* --- 出價面板:點表格裡的人名 -> 在這裡填目前喊價、選得標隊伍、成交 --- */
function drawNom(){
  const box=$('#nom'); if(!box)return; box.innerHTML='';
  // 球員:可打字,datalist 跳出還沒被買走的人(跟得標隊伍同一種搜尋)
  const ps=Object.assign(document.createElement('input'),{type:'text',id:'nomp',placeholder:'球員(打字搜尋)'});
  ps.setAttribute('list','plist'); ps.style.width='220px';
  const pl=el('datalist'); pl.id='plist';
  P.filter(p=>!S.picks.includes(p.id)).forEach(p=>{const o=new Option(p.name);o.label=`建議 $${bid(p)??'-'} · 均價 $${p.avg_paid?Math.round(p.avg_paid):'-'}`;pl.append(o)});
  ps.oninput=()=>{rankList(pl,ps.value);const v=ps.value.trim().toLowerCase();
    const q=P.find(p=>!S.picks.includes(p.id)&&p.name.toLowerCase()===v);
    if(q){S.nom=q.id;S.cur=0;save();drawNom();redrawDraft()}};
  // 沒選球員時也畫出整個面板(欄位停用),高度不變,點人名時下面的表格不會跳
  let p=byId[S.nom]; if(p&&S.picks.includes(p.id))p=null;
  const my=maxBid(S.slot-1);
  if(p){ps.value=p.name; ps.onfocus=()=>ps.select();}
  // 數字上色:綠 = 建議(合理價)、黃 = 市場均價、白 = ESPN 價值、藍 = 我還能出多少(超過建議變紅)
  const v=(x,c)=>`<b style="color:${c}">$${x??'-'}</b>`, bp=p&&bid(p);
  // 剩餘名次:還沒被買走、有數據的人裡,依總分排第幾。便宜但名次很後面 = 不值得
  const tp=p&&total(p), left=p&&tp!==null?1+P.filter(q=>!S.picks.includes(q.id)&&total(q)!==null&&total(q)>tp).length:null;
  // 場上剩幾個空位;名次在前一半 = 綠(搶手),在空位數內 = 黃,超過空位數 = 紅(大概沒人要,會流到 $1)
  const open=S.nTeams*S.rsize-S.picks.length;
  const lc=left===null?'var(--dim)':left<=open/2?'var(--good)':left<=open?'var(--warn)':'var(--bad)';
  box.append(p?el('h2',null,`${logo(p)} ${p.name} <span class="pos">剩餘第 <b style="color:${lc}">${left??'–'}</b> 名 / 場上剩 <b>${open}</b> 空位 · 建議 ${v(bp,'var(--good)')}`
      +` · 成交均價 ${v(p.avg_paid?Math.round(p.avg_paid):null,'var(--warn)')}`
      +` · ESPN ${v(p.auction||null,'var(--text, #e6e6e6)')}`
      +` · 我最高可出 ${v(my,bp&&bp>my?'var(--bad)':'var(--accent)')}</span>`)
    :el('h2','pos',`尚未選球員 —— 打字搜尋或點下方人名 <span class="pos">· 場上剩 ${S.nTeams*S.rsize-S.picks.length} 空位 · 我最高可出 $${my}</span>`));
  box.lastChild.style.minHeight='66px';   // 空/有球員同高(窄螢幕球員資訊會折成兩行)
  box.lastChild.style.fontSize='19.5px';  // 一般 h2 的 1.5 倍,出價時一眼看到價格
  box.lastChild.querySelectorAll('.pos').forEach(x=>x.style.fontSize='16.5px');   // 價格那串也放大 1.5 倍(.pos 預設 11px)
  const line=el('div','draftbar');
  const pr=Object.assign(document.createElement('input'),{type:'number',id:'price',min:1,placeholder:'目前喊價',value:S.cur||''});
  pr.style.width='90px';
  // 得標隊伍:可打字,瀏覽器原生 datalist 跳出建議
  const sel=Object.assign(document.createElement('input'),{type:'text',id:'bidder',placeholder:'得標隊伍(打字搜尋)'});
  sel.setAttribute('list','teamlist'); sel.style.width='220px';
  const dl=el('datalist'); dl.id='teamlist';
  for(let t=0;t<S.nTeams;t++){const o=new Option(teamName(t));o.label=`$${moneyLeft(t)} · 最高 $${maxBid(t)}`;dl.append(o)}
  const findTeam=v=>{v=v.trim().toLowerCase(); if(!v)return -1; if(v==='me')return S.slot-1;   // me 跟 Messi 撞字首,特別處理
    const names=[...Array(S.nTeams).keys()].map(t=>[t,teamName(t).toLowerCase()]);
    const hit=names.find(x=>x[1]===v)||names.filter(x=>x[1].includes(v)).reduce((a,x,_,all)=>all.length===1?x:a,null);
    return hit?hit[0]:-1};
  pr.oninput=()=>{S.cur=+pr.value||0;save()};
  sel.oninput=()=>rankList(dl,sel.value);
  const ok=el('button','act pick','成交');
  ok.onclick=()=>{
    const t=findTeam(sel.value), x=+pr.value;
    if(!(x>=1))return alert('先填得標價格');
    if(t<0)return alert('找不到這隊,請從建議清單選');
    if(x>maxBid(t)&&!confirm(`${teamName(t)} 最高只能出 $${maxBid(t)},仍要記錄?`))return;
    S.picks.push(p.id);S.owner.push(t);S.price.push(x);S.cur=0;S.nom=null;save();render();
  };
  const no=el('button','act','取消'); no.onclick=()=>{S.nom=null;S.cur=0;save();drawNom()};
  line.append(el('span','pos','球員 '),ps,pl,el('span','pos',' 目前喊價 $'),pr,el('span','pos',' 得標 '),sel,dl,' ',ok,no);
  box.append(line);
  postDash(p,left,open,bp,my);
  if(!p){[pr,sel,ok,no].forEach(x=>x.disabled=true);return}
  pr.focus({preventScroll:true});   // 不捲動畫面
}

const allCols=()=>[{h:'總分',k:'total',desc:1,v:p=>total(p),f:p=>hot(total(p),2)}]

function downloadCsv(){

/* ---------- 交易 ---------- */
function tradeView(app){
  if(!S.teams){app.append(el('div','card','<h2>交易分析</h2><p class="hint">先到「連結聯盟」輸入 League ID,才抓得到各隊名單。</p>'));return}
  S.tsel=S.tsel||{out:[],in:[]};
  const box=el('div','card'); box.style.marginBottom='12px';
  box.append(el('h2',null,'對手'));
  const sel=el('select');
  S.teams.filter(t=>t.id!==S.myTeam).forEach(t=>sel.append(new Option(t.name,t.id)));
  sel.value=S.oppTeam||sel.value; S.oppTeam=+sel.value;
  sel.onchange=()=>{S.oppTeam=+sel.value;S.tsel={out:[],in:[]};save();render()};
  box.append(sel); app.append(box);

  const my=S.teams.find(t=>t.id===S.myTeam), opp=S.teams.find(t=>t.id===S.oppTeam);
  const row=el('div','row'); app.append(row);
  [['送出 (我的隊)',my,'out'],['得到 ('+opp.name+')',opp,'in']].forEach(([title,team,key])=>{
    const c=el('div','card'); c.style.flex='1'; c.style.minWidth='300px';
    c.append(el('h2',null,title));
    team.roster.forEach(id=>{
      const p=byId[id]; if(!p)return;
      const t=el('span','tag'+(S.tsel[key].includes(id)?' sel':''),
        `${logo(p)}${p.name} ${posBadge(p)} <span class="pos">${total(p).toFixed(1)}</span>`);
      t.style.borderLeftColor=tm(p).color;
      t.onclick=()=>{S.tsel[key]=S.tsel[key].includes(id)?S.tsel[key].filter(x=>x!==id):[...S.tsel[key],id];save();render()};
      c.append(t);
    });
    row.append(c);
  });

  // H2H 核心:交易前後我對他能贏幾類
  const mineNow=my.roster, oppNow=opp.roster;
  const mineAfter=mineNow.filter(i=>!S.tsel.out.includes(i)).concat(S.tsel.in);
  const oppAfter=oppNow.filter(i=>!S.tsel.in.includes(i)).concat(S.tsel.out);
  const LIVE=CATS.filter(c=>S.w[c]>0);   // 權重 0 = 已棄掉,不列入勝負
  const wins=(a,b)=>{const A=teamCats(a),B=teamCats(b);return LIVE.filter(c=>A[c]>B[c]).length};
  const w0=wins(mineNow,oppNow), w1=wins(mineAfter,oppAfter);
  const res=el('div','card'); res.style.marginTop='12px';
  res.append(el('h2',null,'對上 '+opp.name+' 的類別勝負'));
  const N=LIVE.length;
  res.append(el('div','big',`${w0}-${N-w0} → <span style="color:${w1>w0?'var(--good)':w1<w0?'var(--bad)':'var(--dim)'}">${w1}-${N-w1}</span>`)
    );
  if(N<9)res.append(el('p','hint',`只計入權重 >0 的 ${N} 類(其餘已棄)。`));
  const d={}, A=teamCats(mineNow), B=teamCats(mineAfter);
  CATS.forEach(c=>d[c]=B[c]-A[c]);
  res.append(el('p','hint','我的各類別變化(交易帶來的淨值):'));
  res.append(catBars(d,Math.max(1.5,Math.max(...CATS.map(c=>Math.abs(d[c]))))));
  app.append(res);

  // 自動推薦 1 對 1
  const w=weights(mineNow), sug=[];
  mineNow.forEach(o=>oppNow.forEach(i=>{
    if(!byId[o]||!byId[i])return;
    const after=wins(mineNow.filter(x=>x!==o).concat(i),oppNow.filter(x=>x!==i).concat(o));
    const bal=total(byId[i])-total(byId[o]);
    if(after>w0&&bal<1.5) sug.push({o,i,after,gain:fit(byId[i],w)-fit(byId[o],w),bal});
  }));
  sug.sort((a,b)=>b.after-a.after||b.gain-a.gain);
  const sc=el('div','card'); sc.style.marginTop='12px';
  sc.append(el('h2',null,'自動推薦 1 換 1'));
  if(!sug.length)sc.append(el('p','hint','沒有找到能翻盤又不至於明顯虧價值的 1 換 1。試試 2 換 1,或換個對手。'));
  sug.slice(0,8).forEach(s=>{
    const p=el('p',null,`送 <b>${byId[s.o].name}</b> → 收 <b style="color:var(--good)">${byId[s.i].name}</b>
      &nbsp;類別 ${w0}-${9-w0} → ${s.after}-${9-s.after}
      <span class="hint">(價值差 ${s.bal>0?'+':''}${s.bal.toFixed(1)} —
      ${s.bal>0.5?'對方吃虧,可能不點頭':s.bal<-0.5?'我方讓價,但類別更好(H2H 可接受)':'價值接近,好談'})</span>`);
    p.style.margin='4px 0'; sc.append(p);
  });
  app.append(sc);
}

/* ---------- 連結聯盟 ---------- */
function leagueView(app){
  const c=el('div','card'); c.append(el('h2',null,'連結 ESPN 聯盟'));
  c.innerHTML+=`<p class="hint">在 ESPN 聯盟網址列找 <code>leagueId=</code> 後面那串數字。私人聯盟請先在同一個瀏覽器登入 espn.com。</p>`;
  const inp=Object.assign(document.createElement('input'),{type:'text',id:'lid',placeholder:'League ID',value:S.leagueId||'829293495'});
  const yr=Object.assign(document.createElement('input'),{type:'text',id:'yr',value:S.year||'2027'}); yr.style.width='70px';
  const b=el('button','act','抓取'); b.onclick=loadLeague;
  c.append(inp,' ',yr,' ',b);
  const st=el('p','hint','',''); st.id='lst'; c.append(st);
  if(S.teams){
    c.append(el('h2',null,'我是哪一隊'));
    const sel=el('select');
    S.teams.forEach(t=>sel.append(new Option(`${t.name} (${t.roster.length} 人)`,t.id)));
    // 選了哪隊,選秀頁的「我是第幾隊」就跟著改
    sel.value=S.myTeam; sel.onchange=()=>{S.myTeam=+sel.value;S.slot=S.teams.findIndex(t=>t.id===S.myTeam)+1;save()};
    c.append(sel);
    st.innerHTML=`已載入 ${S.teams.length} 隊。`;
  }
  app.append(c);
  if(S.teams){
    const rf=el('button','act','重新抓取 ESPN 名單'); rf.onclick=loadLeague; c.append(' ',rf);
    app.append(standingsTable(S.teams.map(t=>t.roster)));   // 真實名單(交易審核中的不會反映,要等 ESPN 執行)
  }
}
async function fetchLeague(id,yr){
  const url=`https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/${yr}/segments/0/leagues/${id}?view=mTeam&view=mRoster`;
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401?' — 私人聯盟,請先登入 espn.com':''));
  const d=await r.json();
  S.leagueId=id; S.year=yr;
  // 依 team id 排序,選秀頁的第 t 隊 = S.teams[t]
  S.teams=d.teams.sort((a,b)=>a.id-b.id).map(t=>({id:t.id,name:(t.name||`${t.location||''} ${t.nickname||''}`).trim()||('Team '+t.id),
    roster:(t.roster?.entries||[]).map(e=>e.playerId)}));
  S.nTeams=S.teams.length;
  S.myTeam=S.teams[S.slot-1]?.id??S.teams[0].id;
  save();
}
async function loadLeague(){
  const st=$('#lst'); st.className='hint'; st.textContent='抓取中…';
  try{ await fetchLeague($('#lid').value.trim(),$('#yr').value.trim()); render(); }catch(e){st.className='err';st.textContent='失敗:'+e.message+'(私人聯盟需先在本瀏覽器登入 espn.com)'}
}
</script>
