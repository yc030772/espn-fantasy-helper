<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy BB 助手 · H2H Cat</title>
<style>
:root{--bg:#0f1216;--card:#171c22;--line:#252c35;--fg:#e6e9ee;--dim:#8b95a3;
      --good:#3ddc97;--bad:#ff6b6b;--accent:#4c9aff;--warn:#ffb454;
      --PG:#4c9aff;--SG:#35c5f2;--SF:#3ddc97;--PF:#ffb454;--C:#ff7b72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang TC",Segoe UI,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(90deg,#17408b22,#c9082a22 55%,transparent);position:relative}
header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,#17408b,#c9082a)}
h1{font-size:16px;margin:0;font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 14px;cursor:pointer;border-radius:6px;font-size:13px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#06101f;font-weight:600}
main{padding:16px 18px;max-width:1400px}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.grow{flex:1;min-width:420px}
.side{width:330px;flex-shrink:0}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{background:#0c1014;border:1px solid var(--line);color:var(--fg);padding:6px 9px;border-radius:6px;font:inherit}
input[type=text]{width:170px}
label.chk{color:var(--dim);font-size:12px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
button.act{background:#212a34;border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px}
button.act:hover{border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--dim);font-weight:500;font-size:11px;padding:5px 6px;position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
th:first-child,th.l,td.l{text-align:left}
td{padding:4px 6px;text-align:right;border-top:1px solid #1d232b;white-space:nowrap}
td.name{display:flex;align-items:center;gap:7px}
img.logo{width:22px;height:22px;object-fit:contain;flex-shrink:0;
  background:#e9edf2;border-radius:50%;padding:2px}
tbody tr{border-left:3px solid transparent}
.abbr{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:3px;color:#fff;
  border:1px solid rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.posb{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#1e2630}
tbody tr:hover{background:#1d242c}
tbody tr.rec{background:#14304f}
tbody tr.rec:hover{background:#1a3c63}
tbody tr.rec td{border-top-color:#25507f}
.rechip{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--accent);color:#06101f;margin-left:6px}
.scroll{max-height:66vh;overflow:auto}
.pos{color:var(--dim);font-size:11px}
.pill{font-size:10px;padding:1px 5px;border-radius:4px;background:#2a2016;color:var(--warn);margin-left:4px}
.edge-p{color:var(--good)}.edge-n{color:var(--dim)}
.bar{height:7px;border-radius:4px;background:#222a33;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--good)}
.bar i.neg{background:var(--bad)}
.catrow{display:grid;grid-template-columns:38px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.catrow b{font-weight:500;color:var(--dim)}
.num{text-align:right;color:var(--dim)}
.mine{color:var(--good)}
.gone{opacity:.32}
.hint{color:var(--dim);font-size:12px;margin:8px 0 0}
.tag{display:inline-flex;align-items:center;gap:5px;background:#212a34;border:1px solid var(--line);
  border-left-width:3px;border-radius:5px;padding:2px 7px;margin:2px;font-size:12px;cursor:pointer}
.tag img{width:17px;height:17px;object-fit:contain;background:#e9edf2;border-radius:50%;padding:1.5px}
.tag.sel{background:var(--accent);color:#06101f;border-color:var(--accent)}
.big{font-size:22px;font-weight:600}
.err{color:var(--bad);font-size:12px}
.draftbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.clock{padding:4px 12px;border-radius:6px;background:#1e2630;border:1px solid var(--line);font-size:13px}
.clock.me{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
button.act.pick{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:700}
.strow{display:grid;grid-template-columns:38px 1fr 34px 44px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.strow b{font-weight:500;color:var(--dim)}
.strow .rk{text-align:right;font-weight:700}
.strow .gap{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.strow .bar i{left:0}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#7d8794;opacity:.85}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bcol{background:#12171d;border:1px solid var(--line);border-radius:8px;padding:7px}
.bcol.bme{border-color:var(--accent);background:#131f2e}
.bhead{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--fg)}
.bp{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 4px;margin:2px 0;
  border-left:3px solid var(--line);background:#1a212a;border-radius:3px}
.bp img{width:14px;height:14px;object-fit:contain;background:#e9edf2;border-radius:50%;padding:1px}
.bp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.matrix td{border-top:1px solid #1d232b}
.rksup{font-size:9px;color:var(--dim);margin-left:2px}
</style>

<header>
  <h1>🏀 Fantasy 助手 <span style="color:var(--dim);font-weight:400">H2H 9-Cat</span></h1>
  <span class="hint" id="src"></span>
  <div class="tabs">
    <button data-t="draft" class="on">選秀</button>
    <button data-t="all">總分表</button>
    <button data-t="trade">交易</button>
    <button data-t="fa">FA</button>
    <button data-t="league">連結聯盟</button>
  </div>
</header>
<main id="app"></main>

<script>
const CATS=['PTS','REB','AST','STL','BLK','3PM','TO','FG_imp','FT_imp'];
// 建議權重 = 1/σ(隊伍該類別總分),TO 因與 PTS/AST 相關 -0.85 額外壓低
const PRESETS={
  '均衡(建議)':{PTS:1.25,REB:1.10,AST:1.00,STL:1.20,BLK:0.90,'3PM':0.95,TO:0.60,FG_imp:0.90,FT_imp:0.75},
  '全部 1.0(純 z)':{PTS:1,REB:1,AST:1,STL:1,BLK:1,'3PM':1,TO:1,FG_imp:1,FT_imp:1},
  '棄 TO + FT%':{PTS:1.35,REB:1.15,AST:1.20,STL:1.25,BLK:0.95,'3PM':1.00,TO:0,FG_imp:0.95,FT_imp:0},
  '棄 FG% + BLK':{PTS:1.30,REB:1.05,AST:1.15,STL:1.25,BLK:0,'3PM':1.20,TO:0.60,FG_imp:0,FT_imp:0.95},
  '棄 AST + 3PM(大隻佬)':{PTS:1.25,REB:1.30,AST:0,STL:1.15,BLK:1.30,'3PM':0,TO:0.70,FG_imp:1.15,FT_imp:0.60},
};
const LBL={PTS:'PTS',REB:'REB',AST:'AST',STL:'STL',BLK:'BLK','3PM':'3PM',TO:'TO',FG_imp:'FG%',FT_imp:'FT%'};
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S=JSON.parse(localStorage.getItem('fbb')||'{}');
const save=()=>localStorage.setItem('fbb',JSON.stringify(S));
S.picks=S.picks||[]; S.nTeams=S.nTeams||12; S.slot=S.slot||1;
S.order=S.order||'espn';   // 回測:ESPN 排名 ρ=.906 > 去年數據 ρ=.769
S.mine=[]; S.gone=[];   // 由 picks 推導,見 syncDraft()
S.w=S.w||{...PRESETS['均衡(建議)']}; S.preset=S.preset||'均衡(建議)';
let P=[], byId={}, T={}, tab='draft';
/* 蛇型:第 0 輪 0→n-1,第 1 輪 n-1→0,依此類推 */
const teamOf=i=>{const n=S.nTeams,r=Math.floor(i/n),p=i%n;return r%2?n-1-p:p};
const rosterOf=t=>S.picks.filter((_,i)=>teamOf(i)===t);
const onClock=()=>teamOf(S.picks.length);
const teamName=t=>t===S.slot-1?'我':`Team ${t+1}`;
/* 我下一次輪到的是第幾順位(1-based),沒有則 null */
function nextMyPick(){
  for(let i=S.picks.length;i<S.nTeams*14;i++) if(teamOf(i)===S.slot-1) return i+1;
  return null;
}
function syncDraft(){
  S.mine=rosterOf(S.slot-1);
  S.gone=S.picks.filter(id=>!S.mine.includes(id));
}
const tm=p=>T[p.team]||{abbr:'FA',color:'#39424e',logo:''};
const logo=p=>tm(p).logo?`<img class="logo" src="${tm(p).logo}" alt="" loading="lazy">`:'';
const posBadge=p=>`<span class="posb" style="color:var(--${p.pos})">${p.pos}</span>`;
const abbrChip=p=>`<span class="abbr" style="background:${tm(p).color}">${tm(p).abbr}</span>`;

// 出賽數折算:H2H 每週對戰,受傷坐板凳的球員拿不到分
const durability=p=>S.gp===false?1:Math.min(1,(p.GP+8)/70);
const catZ=(p,c)=>p['z'+c]*durability(p);
const total=p=>CATS.reduce((s,c)=>s+S.w[c]*catZ(p,c),0);   // 加權總分
const hasAdp=p=>p.adp&&p.adp<140;   // 140 = ESPN 未排名的預設值
/* 排序依據。回測 312 人:ESPN 排名對「下一季實際 9-cat 表現」的 Spearman
   ρ=.906,去年實際數據只有 .769,混合反而更差 -> 預設用 ESPN 排名。
   但去年數據仍然不可少:類別強弱、建議、交易分析全部靠它。 */
function orderer(pool){
  const bt={}, be={};
  [...pool].sort((a,b)=>total(b)-total(a)).forEach((p,i)=>bt[p.id]=i);
  [...pool].sort((a,b)=>(a.espn_rank||9999)-(b.espn_rank||9999)).forEach((p,i)=>be[p.id]=i);
  return p=>S.order==='total'?bt[p.id]
          :S.order==='espn'?be[p.id]
          :0.7*be[p.id]+0.3*bt[p.id];
}
const ORDER={espn:'ESPN 排名(回測最準)',total:'總分(去年數據)',mix:'混合 70/30'};
// 分數熱度:綠(強)→ 灰(中)→ 紅(弱)
const heat=v=>{const t=Math.max(-1,Math.min(1,v/8));
  return t>0?`hsl(${152-t*8} 65% ${52+t*14}%)`:`hsl(${6} ${45+(-t)*30}% ${58+t*10}%)`};
const hot=(v,d=1)=>`<b style="color:${heat(v)}">${v.toFixed(d)}</b>`;

fetch('data.json').then(r=>r.json()).then(d=>{
  P=d.players||d; T=d.teams||{};                       // 舊格式(純陣列)也還能開
  P.forEach(p=>byId[p.id]=p);
  $('#src').innerHTML=`${P.length} 名球員 · 數據 2025-26 實際 · 排名/ADP 2026-27`;
  render();
});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

/* ---------- 陣容 / 分類強弱 ---------- */
const teamCats=ids=>{const t={};CATS.forEach(c=>t[c]=ids.reduce((s,i)=>s+(byId[i]?catZ(byId[i],c):0),0));return t};
const teamW=ids=>{const t=teamCats(ids);CATS.forEach(c=>t[c]*=S.w[c]);return t};
// 弱項加權:我缺的類別,該類別的球員對我更值錢
function weights(ids){
  const t=teamCats(ids), n=Math.max(ids.length,1), w={};
  const avg=CATS.map(c=>t[c]/n), m=Math.max(...avg.map(Math.abs),.5);
  CATS.forEach((c,i)=>w[c]=Math.min(1.6,Math.max(.5,1-avg[i]/m)));
  return w;
}
// 補洞分:完全以「我缺什麼」加權。只用來挑出建議人選,不參與排序。
const fit=(p,w)=>CATS.reduce((s,c)=>s+w[c]*S.w[c]*catZ(p,c),0);
// 建議名單 = 補洞分最高的前 n 名(隊上還沒人時沒有弱項訊號,不標)
function recSet(pool,ids,n=8){
  if(!ids.length)return new Set();
  const w=weights(ids);
  return new Set([...pool].sort((a,b)=>fit(b,w)-fit(a,w)).slice(0,n).map(p=>p.id));
}

function catBars(t,scale){
  const box=el('div');
  CATS.forEach(c=>{
    const v=t[c], pct=Math.min(50,Math.abs(v)/scale*50);
    const r=el('div','catrow');
    r.append(el('b',null,LBL[c]));
    const bar=el('div','bar'), i=el('i',v<0?'neg':'');
    i.style.width=pct+'%'; i.style.left=v<0?(50-pct)+'%':'50%';
    bar.append(i); r.append(bar);
    r.append(el('span','num '+(v>0?'mine':''),v.toFixed(1)));
    box.append(r);
  });
  return box;
}

/* ---------- 表格 ---------- */
function playerTable(list,cols,rowAct,onSort,rec){
  const wrap=el('div','scroll'), tb=el('table');
  tb.innerHTML='<thead><tr><th class="l">#</th><th class="l">球員</th><th class="l">隊</th><th class="l">POS</th><th>GP</th><th>MIN</th>'
    +cols.map(c=>`<th>${c.h}</th>`).join('')+'<th></th></tr></thead>';
  if(onSort)tb.querySelectorAll('th').forEach((th,i)=>{if(i>=6&&i-6<cols.length)th.onclick=()=>onSort(cols[i-6])});
  const body=el('tbody');
  list.forEach((p,i)=>{
    const tr=el('tr');
    if(rec&&rec.has(p.id))tr.classList.add('rec');
    if(S.mine.includes(p.id))tr.classList.add('mine');
    if(S.gone.includes(p.id))tr.classList.add('gone');
    tr.style.borderLeftColor=tm(p).color;
    tr.innerHTML=`<td class="l">${i+1}</td>`
      +`<td class="l name">${logo(p)}<span>${p.name}</span>`
      +`${rec&&rec.has(p.id)?'<span class="rechip">建議</span>':''}`
      +`${p.injury&&p.injury!=='ACTIVE'?`<span class="pill">${p.injury}</span>`:''}</td>`
      +`<td class="l">${abbrChip(p)}</td><td class="l">${posBadge(p)}</td>`
      +`<td>${p.GP}</td><td>${p.MIN}</td>`+cols.map(c=>`<td>${c.f(p)}</td>`).join('');
    const td=el('td'); if(rowAct)rowAct(p,td); tr.append(td); body.append(tr);
  });
  tb.append(body); wrap.append(tb); return wrap;
}
const num=(k,d=1)=>({h:k,f:p=>(p[k]??0).toFixed(d)});

/* ---------- 三個分頁 ---------- */
function render(){
  const app=$('#app'); app.innerHTML='';
  if(!P.length){app.append(el('p','hint','載入中…'));return}
  syncDraft();
  ({draft:draftView,all:allView,trade:tradeView,fa:faView,league:leagueView})[tab](app);
}

function draftView(app){
  /* --- 最上面:聯盟設定與現在輪到誰 --- */
  const setup=el('div','card'); setup.style.marginBottom='12px';
  setup.append(el('h2',null,'蛇型選秀設定'));
  const line=el('div','draftbar');
  const mk=(label,val,min,max,on)=>{
    const g=el('span'); g.append(el('span','pos',label+' '));
    const i=Object.assign(document.createElement('input'),{type:'number',min,max,value:val});
    i.style.width='58px'; i.onchange=()=>on(Math.max(min,Math.min(max,+i.value||min)));
    g.append(i); return g;
  };
  line.append(mk('隊伍數',S.nTeams,2,20,v=>{S.nTeams=v;S.slot=Math.min(S.slot,v);save();render()}));
  line.append(mk('我的順位',S.slot,1,S.nTeams,v=>{S.slot=v;save();render()}));

  const i=S.picks.length, rd=Math.floor(i/S.nTeams)+1, pk=i%S.nTeams+1, t=onClock();
  const mine=t===S.slot-1;
  const clock=el('span','clock'+(mine?' me':''));
  clock.innerHTML=`第 ${rd} 輪 · 第 ${pk} 順位 &nbsp;→&nbsp; <b>${mine?'輪到你':teamName(t)}</b>`;
  line.append(clock);
  const nx=nextMyPick();
  if(!mine&&nx) line.append(el('span','hint',`你的下一手是第 ${nx} 順位(還要等 ${nx-i-1} 人)`));

  const un=el('button','act','復原上一手'); un.onclick=()=>{S.picks.pop();save();render()};
  const rs=el('button','act','重置選秀'); rs.onclick=()=>{if(confirm('清空整個選秀板?')){S.picks=[];save();render()}};
  line.append(un,rs);
  const gp=el('label','chk'); gp.innerHTML='<input type="checkbox"'+(S.gp!==false?' checked':'')+'> 考慮出賽數';
  gp.querySelector('input').onchange=e=>{S.gp=e.target.checked;save();render()};
  line.append(gp);
  setup.append(line);
  app.append(setup);

  /* --- 搜尋列 --- */
  const bar=el('div','card',''); bar.style.marginBottom='12px';
  bar.append(el('span',null,'搜尋 '),Object.assign(document.createElement('input'),
    {type:'text',id:'q',placeholder:'球員名',oninput:redrawDraft}));
  const sel=el('select'); sel.id='pf';
  ['全部','PG','SG','SF','PF','C'].forEach(o=>sel.append(new Option(o,o)));
  sel.onchange=redrawDraft; bar.append(' ',sel,' ');
  bar.append(el('span','pos','排序 '));
  const os=el('select');
  Object.entries(ORDER).forEach(([k,v])=>os.append(new Option(v,k)));
  os.value=S.order; os.onchange=()=>{S.order=os.value;save();render()};
  bar.append(os);
  bar.append(el('span','hint',' · 回測 312 人:ESPN 排名 ρ=.906、去年數據 ρ=.769'));
  app.append(bar);

  const row=el('div','row'), left=el('div','card grow'), right=el('div','side card');
  left.id='dl'; app.append(row); row.append(left,right);
  right.id='stand';
  drawStandings();
  redrawDraft();
  app.append(standingsTable());
  app.append(boardView());
}

/* --- 9 類別相對排名:我 vs 其他 11 隊 --- */
function drawStandings(){
  const box=$('#stand'); if(!box)return; box.innerHTML='';
  box.append(el('h2',null,`類別相對排名 (${S.nTeams} 隊)`));
  if(!S.picks.length){
    box.append(el('p','hint','開始選人之後,這裡會即時顯示你在每個類別排第幾、跟第一名差多少。'));
    return;
  }
  const all=[...Array(S.nTeams).keys()].map(t=>({t,cat:teamCats(rosterOf(t))}));
  const me=all[S.slot-1];
  let wins=0;
  CATS.forEach(c=>{
    const sorted=[...all].sort((a,b)=>b.cat[c]-a.cat[c]);
    const rank=sorted.findIndex(x=>x.t===me.t)+1;
    const best=sorted[0].cat[c], v=me.cat[c];
    const gapTop=v-best, ahead=rank>1?sorted[rank-2].cat[c]-v:0;
    if(rank<=Math.ceil(S.nTeams/2))wins++;
    const r=el('div','strow');
    r.innerHTML=`<b>${LBL[c]}</b>`;
    const bar=el('div','bar');
    const spread=Math.max(...all.map(x=>x.cat[c]))-Math.min(...all.map(x=>x.cat[c]))||1;
    const lo=Math.min(...all.map(x=>x.cat[c]));
    const fill=el('i'); fill.style.cssText=`left:0;width:${(v-lo)/spread*100}%;background:${
      rank<=3?'var(--good)':rank<=S.nTeams/2?'var(--warn)':'var(--bad)'}`;
    bar.append(fill);
    all.forEach(x=>{if(x.t===me.t)return;const d=el('span','tick');
      d.style.left=((x.cat[c]-lo)/spread*100)+'%';bar.append(d)});
    r.append(bar);
    const rk=el('span','rk');
    rk.style.color=rank<=3?'var(--good)':rank<=S.nTeams/2?'var(--warn)':'var(--bad)';
    rk.textContent=`#${rank}`;
    r.append(rk);
    r.append(el('span','gap',rank===1?'領先 '+(v-sorted[1].cat[c]).toFixed(1):gapTop.toFixed(1)));
    r.title=`我 ${v.toFixed(1)} · 第一名 ${best.toFixed(1)}`+(rank>1?` · 追上前一名還差 ${ahead.toFixed(1)}`:'');
    box.append(r);
  });
  box.append(el('p','hint',`目前站在前段的類別:<b style="color:${wins>=5?'var(--good)':'var(--bad)'}">${wins}/9</b>
    (H2H 需要贏 5 類)。灰點是其他隊的位置,長條是你。`));
  const weak=CATS.map(c=>{
    const sorted=[...all].sort((a,b)=>b.cat[c]-a.cat[c]);
    return [c,sorted.findIndex(x=>x.t===me.t)+1];
  }).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>LBL[x[0]]);
  box.append(el('p','hint','排最後面的三項:<b style="color:var(--bad)">'+weak.join(' · ')
    +'</b><br>能補這幾項的人會<b style="color:var(--accent)">反白標「建議」</b>,但排序一律照總分。'));
}

/* --- 各隊 × 各類別 對照表 --- */
function standingsTable(){
  const box=el('div','card'); box.style.marginTop='12px';
  box.append(el('h2',null,'各隊 × 各類別 對照表'));
  if(!S.picks.length){
    box.append(el('p','hint','開始選人之後,這裡會列出全部 '+S.nTeams+' 隊在 9 個類別的數字與名次。'));
    return box;
  }
  const all=[...Array(S.nTeams).keys()].map(t=>({t,cat:teamCats(rosterOf(t)),n:rosterOf(t).length}));
  // 每個類別的名次
  const rk={};
  CATS.forEach(c=>{
    const sorted=[...all].sort((a,b)=>b.cat[c]-a.cat[c]);
    rk[c]={}; sorted.forEach((x,i)=>rk[c][x.t]=i+1);
  });
  const half=Math.ceil(S.nTeams/2);
  const wrap=el('div','scroll'), tb=el('table','matrix');
  tb.innerHTML='<thead><tr><th class="l">隊伍</th><th>人數</th>'
    +CATS.map(c=>`<th>${LBL[c]}</th>`).join('')+'<th>前段</th></tr></thead>';
  const body=el('tbody');
  // 依「站上前段的類別數」排,強隊在上
  const score=x=>CATS.filter(c=>rk[c][x.t]<=half).length;
  [...all].sort((a,b)=>score(b)-score(a)).forEach(x=>{
    const tr=el('tr'); if(x.t===S.slot-1)tr.classList.add('rec');
    let html=`<td class="l"><b>${teamName(x.t)}</b></td><td>${x.n}</td>`;
    CATS.forEach(c=>{
      const r=rk[c][x.t];
      const col=r<=3?'var(--good)':r<=half?'var(--warn)':'var(--bad)';
      html+=`<td><span style="color:${col}">${x.cat[c].toFixed(1)}</span>`
           +`<sup class="rksup">${r}</sup></td>`;
    });
    const w=score(x);
    html+=`<td><b style="color:${w>=5?'var(--good)':'var(--bad)'}">${w}/9</b></td>`;
    tr.innerHTML=html; body.append(tr);
  });
  tb.append(body); wrap.append(tb); box.append(wrap);
  box.append(el('p','hint','數字 = 該隊該類別的 z 總和(已套用你的權重),右上小字 = 名次。'
    +`綠 = 前 3、黃 = 前段、紅 = 後段。「前段」= 排在前 ${half} 名的類別數,H2H 需要 5 類。`));
  return box;
}

/* --- 選秀板:每隊已選到的人 --- */
function boardView(){
  const box=el('div','card'); box.style.marginTop='12px';
  box.append(el('h2',null,`選秀板 (已選 ${S.picks.length} 人)`));
  const grid=el('div','board');
  for(let t=0;t<S.nTeams;t++){
    const col=el('div','bcol'+(t===S.slot-1?' bme':''));
    col.append(el('div','bhead',`${teamName(t)} <span class="pos">${rosterOf(t).length}</span>`));
    S.picks.forEach((id,i)=>{
      if(teamOf(i)!==t)return;
      const p=byId[id]; if(!p)return;
      const d=el('div','bp',`${logo(p)}<span>${p.name}</span>`);
      d.style.borderLeftColor=tm(p).color;
      d.title=`第 ${i+1} 順位 · 總分 ${total(p).toFixed(1)}`;
      col.append(d);
    });
    grid.append(col);
  }
  box.append(grid);
  return box;
}
function redrawDraft(){
  const q=($('#q')?.value||'').toLowerCase(), pf=$('#pf')?.value||'全部';
  const w=weights(S.mine);
  let pool=P.filter(p=>!S.picks.includes(p.id))
    .filter(p=>p.name.toLowerCase().includes(q)&&(pf==='全部'||p.pos===pf))
    .sort((a,b)=>total(b)-total(a));
  const ord=orderer(pool); pool.sort((a,b)=>ord(a)-ord(b));
  const rec=recSet(pool.slice(0,120),S.mine);        // 建議只從前 120 名裡挑
  const t=onClock(), mineTurn=t===S.slot-1;
  const cols=[{h:'總分',f:p=>hot(total(p))},{h:'ESPN',f:p=>p.espn_rank||'-'},
    {h:'補洞',f:p=>S.mine.length?fit(p,w).toFixed(1):'-'},
    {h:'ADP',f:p=>hasAdp(p)?Math.round(p.adp):'-'},
    {h:'$',f:p=>p.auction?`<span style="color:var(--warn)">$${p.auction}</span>`:'-'},
    {h:'撿便宜',f:p=>{if(!hasAdp(p))return '-';
      const e=p.adp-(pool.indexOf(p)+1);
      return `<span class="${e>8?'edge-p':'edge-n'}">${e>0?'+':''}${Math.round(e)}</span>`}}];
  const tbl=playerTable(pool.slice(0,250),cols,(p,td)=>{
    const a=el('button','act'+(mineTurn?' pick':''),mineTurn?'我選':'選走');
    a.title=`歸給 ${teamName(t)}`;
    a.onclick=()=>{S.picks.push(p.id);save();render()};
    td.append(a);
  },null,rec);
  const dl=$('#dl'); dl.innerHTML='';
  dl.append(el('h2',null,`球員排名(依${ORDER[S.order]}) — 目前輪到 ${mineTurn?'你':teamName(t)}`),tbl);
}

/* ---------- 總分表(全部球員 + 可調權重) ---------- */
function allView(app){
  const wbox=el('div','card'); wbox.style.marginBottom='12px';
  wbox.append(el('h2',null,'類別權重'));
  const ps=el('select');
  Object.keys(PRESETS).forEach(k=>ps.append(new Option(k,k)));
  ps.append(new Option('自訂','自訂')); ps.value=S.preset;
  ps.onchange=()=>{S.preset=ps.value;if(PRESETS[ps.value])S.w={...PRESETS[ps.value]};save();render()};
  wbox.append(ps,' ');
  CATS.forEach(c=>{
    const g=el('span'); g.style.cssText='display:inline-block;margin:4px 10px 0 0';
    g.append(el('span','pos',LBL[c]+' '));
    const i=Object.assign(document.createElement('input'),{type:'number',step:'0.05',min:'0',max:'3',value:S.w[c]});
    i.style.width='62px';
    i.onchange=()=>{S.w[c]=parseFloat(i.value)||0;S.preset='自訂';save();render()};
    g.append(i); wbox.append(g);
  });
  wbox.append(el('p','hint','權重建議 = 1/σ(整隊該類別總分):類別內差距越大,多一單位 z 越難翻盤,權重越低。TO 因與 PTS/AST 相關 −0.85,額外壓到 0.6。設 0 = 直接棄掉該類別。<br>改權重會同時影響「選秀 / 交易 / FA」三頁。'));
  app.append(wbox);

  S.sort=S.sort||'total'; S.q2=S.q2||'';
  const bar=el('div','card'); bar.style.marginBottom='12px';
  const q=Object.assign(document.createElement('input'),{type:'text',placeholder:'球員名',value:S.q2});
  q.oninput=()=>{S.q2=q.value;drawAll()};
  bar.append('搜尋 ',q,' ');
  const pf=el('select'); ['全部','PG','SG','SF','PF','C'].forEach(o=>pf.append(new Option(o,o)));
  pf.id='pf2'; pf.onchange=drawAll; bar.append(pf,' ');
  const dl=el('button','act','下載 CSV'); dl.onclick=downloadCsv; bar.append(dl);
  bar.append(el('span','hint',' · 點欄位標題可排序'));
  app.append(bar);
  const box=el('div','card'); box.id='allbox'; app.append(box);
  drawAll();
}
const allCols=()=>[{h:'總分',k:'total',f:p=>hot(total(p),2)}]
  .concat(CATS.map(c=>({h:LBL[c],k:c,f:p=>{const v=S.w[c]*catZ(p,c);
    return `<span class="${v>0.6?'mine':v<-0.6?'edge-n':''}" style="${v<-0.6?'color:var(--bad)':''}">${v.toFixed(2)}</span>`}})))
  .concat([{h:'ADP',k:'adp',f:p=>hasAdp(p)?Math.round(p.adp):'-'},
            {h:'$',k:'auction',f:p=>p.auction?`<span style="color:var(--warn)">$${p.auction}</span>`:'-'},
            {h:'ESPN',k:'espn_rank',f:p=>p.espn_rank||'-'}]);
function allList(){
  const q=(S.q2||'').toLowerCase(), pf=$('#pf2')?.value||'全部';
  const key=p=>S.sort==='total'?total(p)
    :S.sort==='adp'?-(hasAdp(p)?p.adp:999)
    :S.sort==='espn_rank'?-(p.espn_rank||999)
    :S.sort==='auction'?(p.auction||0)
    :S.w[S.sort]*catZ(p,S.sort);
  return P.filter(p=>p.name.toLowerCase().includes(q)&&(pf==='全部'||p.pos===pf)).sort((a,b)=>key(b)-key(a));
}
function drawAll(){
  const list=allList(), box=$('#allbox'); box.innerHTML='';
  const sn={total:'總分',adp:'ADP',auction:'拍賣價',espn_rank:'ESPN 排名'}[S.sort]||LBL[S.sort];
  box.append(el('h2',null,`全部球員加權總分 (${list.length} 人,依 ${sn} 排序)`));
  box.append(playerTable(list,allCols(),null,c=>{S.sort=c.k;save();drawAll()}));
}
function downloadCsv(){
  const rows=allList();
  const head=['排名','球員','隊','POS','GP','MIN','總分',...CATS.map(c=>LBL[c]),'ADP','拍賣價','ESPN排名'];
  const body=rows.map((p,i)=>[i+1,p.name,tm(p).abbr,p.pos,p.GP,p.MIN,total(p).toFixed(3),
    ...CATS.map(c=>(S.w[c]*catZ(p,c)).toFixed(3)),hasAdp(p)?Math.round(p.adp):'',p.auction||'',p.espn_rank||'']);
  const csv='\ufeff'+[head,...body].map(r=>r.map(x=>`"${x}"`).join(',')).join('\n');
  const a=el('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='fantasy_總分.csv'; a.click();
}

/* ---------- 交易 ---------- */
function tradeView(app){
  if(!S.teams){app.append(el('div','card','<h2>交易分析</h2><p class="hint">先到「連結聯盟」輸入 League ID,才抓得到各隊名單。</p>'));return}
  S.tsel=S.tsel||{out:[],in:[]};
  const box=el('div','card'); box.style.marginBottom='12px';
  box.append(el('h2',null,'對手'));
  const sel=el('select');
  S.teams.filter(t=>t.id!==S.myTeam).forEach(t=>sel.append(new Option(t.name,t.id)));
  sel.value=S.oppTeam||sel.value; S.oppTeam=+sel.value;
  sel.onchange=()=>{S.oppTeam=+sel.value;S.tsel={out:[],in:[]};save();render()};
  box.append(sel); app.append(box);

  const my=S.teams.find(t=>t.id===S.myTeam), opp=S.teams.find(t=>t.id===S.oppTeam);
  const row=el('div','row'); app.append(row);
  [['送出 (我的隊)',my,'out'],['得到 ('+opp.name+')',opp,'in']].forEach(([title,team,key])=>{
    const c=el('div','card'); c.style.flex='1'; c.style.minWidth='300px';
    c.append(el('h2',null,title));
    team.roster.forEach(id=>{
      const p=byId[id]; if(!p)return;
      const t=el('span','tag'+(S.tsel[key].includes(id)?' sel':''),
        `${logo(p)}${p.name} ${posBadge(p)} <span class="pos">${total(p).toFixed(1)}</span>`);
      t.style.borderLeftColor=tm(p).color;
      t.onclick=()=>{S.tsel[key]=S.tsel[key].includes(id)?S.tsel[key].filter(x=>x!==id):[...S.tsel[key],id];save();render()};
      c.append(t);
    });
    row.append(c);
  });

  // H2H 核心:交易前後我對他能贏幾類
  const mineNow=my.roster, oppNow=opp.roster;
  const mineAfter=mineNow.filter(i=>!S.tsel.out.includes(i)).concat(S.tsel.in);
  const oppAfter=oppNow.filter(i=>!S.tsel.in.includes(i)).concat(S.tsel.out);
  const LIVE=CATS.filter(c=>S.w[c]>0);   // 權重 0 = 已棄掉,不列入勝負
  const wins=(a,b)=>{const A=teamCats(a),B=teamCats(b);return LIVE.filter(c=>A[c]>B[c]).length};
  const w0=wins(mineNow,oppNow), w1=wins(mineAfter,oppAfter);
  const res=el('div','card'); res.style.marginTop='12px';
  res.append(el('h2',null,'對上 '+opp.name+' 的類別勝負'));
  const N=LIVE.length;
  res.append(el('div','big',`${w0}-${N-w0} → <span style="color:${w1>w0?'var(--good)':w1<w0?'var(--bad)':'var(--dim)'}">${w1}-${N-w1}</span>`)
    );
  if(N<9)res.append(el('p','hint',`只計入權重 >0 的 ${N} 類(其餘已棄)。`));
  const d={}, A=teamCats(mineNow), B=teamCats(mineAfter);
  CATS.forEach(c=>d[c]=B[c]-A[c]);
  res.append(el('p','hint','我的各類別變化(交易帶來的淨值):'));
  res.append(catBars(d,Math.max(1.5,Math.max(...CATS.map(c=>Math.abs(d[c]))))));
  app.append(res);

  // 自動推薦 1 對 1
  const w=weights(mineNow), sug=[];
  mineNow.forEach(o=>oppNow.forEach(i=>{
    if(!byId[o]||!byId[i])return;
    const after=wins(mineNow.filter(x=>x!==o).concat(i),oppNow.filter(x=>x!==i).concat(o));
    const bal=total(byId[i])-total(byId[o]);
    if(after>w0&&bal<1.5) sug.push({o,i,after,gain:fit(byId[i],w)-fit(byId[o],w),bal});
  }));
  sug.sort((a,b)=>b.after-a.after||b.gain-a.gain);
  const sc=el('div','card'); sc.style.marginTop='12px';
  sc.append(el('h2',null,'自動推薦 1 換 1'));
  if(!sug.length)sc.append(el('p','hint','沒有找到能翻盤又不至於明顯虧價值的 1 換 1。試試 2 換 1,或換個對手。'));
  sug.slice(0,8).forEach(s=>{
    const p=el('p',null,`送 <b>${byId[s.o].name}</b> → 收 <b style="color:var(--good)">${byId[s.i].name}</b>
      &nbsp;類別 ${w0}-${9-w0} → ${s.after}-${9-s.after}
      <span class="hint">(價值差 ${s.bal>0?'+':''}${s.bal.toFixed(1)} —
      ${s.bal>0.5?'對方吃虧,可能不點頭':s.bal<-0.5?'我方讓價,但類別更好(H2H 可接受)':'價值接近,好談'})</span>`);
    p.style.margin='4px 0'; sc.append(p);
  });
  app.append(sc);
}

/* ---------- FA ---------- */
function faView(app){
  if(!S.teams){app.append(el('div','card','<h2>FA 推薦</h2><p class="hint">先到「連結聯盟」輸入 League ID。</p>'));return}
  const owned=new Set(S.teams.flatMap(t=>t.roster));
  const my=S.teams.find(t=>t.id===S.myTeam).roster;
  const w=weights(my);
  const fa=P.filter(p=>!owned.has(p.id)).sort((a,b)=>total(b)-total(a));
  const rec=recSet(fa.slice(0,80),my);
  const row=el('div','row'), left=el('div','card grow'), right=el('div','side card');
  right.append(el('h2',null,'我的隊伍體質'));
  right.append(catBars(teamCats(my),Math.max(3,my.length*1.2)));
  const weak=CATS.map(c=>[c,teamCats(my)[c]]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>LBL[x[0]]);
  right.append(el('p','hint','最弱:<b style="color:var(--bad)">'+weak.join(' · ')+'</b>。FA 依總分排序,能補這幾項的人反白標「建議」。'));
  // 誰該被 drop
  const worst=[...my].filter(i=>byId[i]).sort((a,b)=>fit(byId[a],w)-fit(byId[b],w)).slice(0,3);
  right.append(el('h2',null,'考慮 drop'));
  worst.forEach(i=>right.append(el('p','hint',`${byId[i].name} <span class="pos">${byId[i].pos}</span> · 契合度 ${fit(byId[i],w).toFixed(1)}`)));
  left.append(el('h2',null,`可撿的自由球員 (${fa.length} 人)`));
  left.append(playerTable(fa.slice(0,120),
    [{h:'總分',f:p=>hot(total(p))},{h:'補洞',f:p=>fit(p,w).toFixed(1)},
     {h:'補到',f:p=>CATS.map(c=>[c,catZ(p,c)]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>LBL[x[0]]).join(' ')}],
    null,null,rec));
  row.append(left,right); app.append(row);
}

/* ---------- 連結聯盟 ---------- */
function leagueView(app){
  const c=el('div','card'); c.append(el('h2',null,'連結 ESPN 聯盟'));
  c.innerHTML+=`<p class="hint">在 ESPN 聯盟網址列找 <code>leagueId=</code> 後面那串數字。私人聯盟請先在同一個瀏覽器登入 espn.com。</p>`;
  const inp=Object.assign(document.createElement('input'),{type:'text',id:'lid',placeholder:'League ID',value:S.leagueId||''});
  const yr=Object.assign(document.createElement('input'),{type:'text',id:'yr',value:S.year||'2026'}); yr.style.width='70px';
  const b=el('button','act','抓取'); b.onclick=loadLeague;
  c.append(inp,' ',yr,' ',b);
  const st=el('p','hint','',''); st.id='lst'; c.append(st);
  if(S.teams){
    c.append(el('h2',null,'我是哪一隊'));
    const sel=el('select');
    S.teams.forEach(t=>sel.append(new Option(`${t.name} (${t.roster.length} 人)`,t.id)));
    sel.value=S.myTeam; sel.onchange=()=>{S.myTeam=+sel.value;save()};
    c.append(sel);
    st.innerHTML=`已載入 ${S.teams.length} 隊。`;
  }
  app.append(c);
}
async function loadLeague(){
  const id=$('#lid').value.trim(), yr=$('#yr').value.trim(), st=$('#lst');
  st.className='hint'; st.textContent='抓取中…';
  const url=`https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/${yr}/segments/0/leagues/${id}?view=mTeam&view=mRoster`;
  try{
    const r=await fetch(url,{credentials:'include'});
    if(!r.ok)throw new Error('HTTP '+r.status+(r.status===401?' — 私人聯盟,請先登入 espn.com':''));
    const d=await r.json();
    S.leagueId=id; S.year=yr;
    S.teams=d.teams.map(t=>({id:t.id,name:(t.name||`${t.location||''} ${t.nickname||''}`).trim()||('Team '+t.id),
      roster:(t.roster?.entries||[]).map(e=>e.playerId)}));
    S.myTeam=S.myTeam&&S.teams.some(t=>t.id===S.myTeam)?S.myTeam:S.teams[0].id;
    save(); render();
  }catch(e){st.className='err';st.textContent='失敗:'+e.message+'(私人聯盟需先在本瀏覽器登入 espn.com)'}
}
</script>
